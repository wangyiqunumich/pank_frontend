# Public HIRN query-planning and retrieval-auditing demo.
location = /hirn-literature-api/agent {
  return 308 /hirn-literature-api/agent/;
}

location = /hirn-literature-api/agent/docs         { return 404; }
location = /hirn-literature-api/agent/redoc        { return 404; }
location = /hirn-literature-api/agent/openapi.json { return 404; }

location ^~ /hirn-literature-api/agent/ {
  limit_req zone=pankgraph_qa_per_ip burst=5 nodelay;
  limit_req_status 429;

  client_max_body_size 128k;

  proxy_http_version 1.1;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Host              $host;

  proxy_pass http://127.0.0.1:8102/;

  proxy_buffering off;
  proxy_cache off;
  gzip off;
  proxy_connect_timeout 5s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
  proxy_set_header Connection "";
}
