worker_processes 1;
error_log stderr;
pid /tmp/hirn-agent-nginx-test.pid;

events {
  worker_connections 32;
}

http {
  access_log off;
  client_body_temp_path /tmp/hirn-agent-nginx-client;
  proxy_temp_path /tmp/hirn-agent-nginx-proxy;
  fastcgi_temp_path /tmp/hirn-agent-nginx-fastcgi;
  uwsgi_temp_path /tmp/hirn-agent-nginx-uwsgi;
  scgi_temp_path /tmp/hirn-agent-nginx-scgi;
  limit_req_zone $binary_remote_addr zone=pankgraph_qa_per_ip:1m rate=10r/m;

  server {
    listen 127.0.0.1:18999;
    server_name localhost;
    include /etc/nginx/glkbpro.d/hirn-agent-location.conf;
  }
}
