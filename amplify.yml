version: 1
frontend:
  phases:
    preBuild:
      commands:
        - bash scripts/check-dev-origin.sh
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
  cache:
    paths:
      - ".npm/**/*"
